<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bowline — A calmer way through your day</title>
  <meta name="description" content="A daily support app for ADHD, autism, AuDHD, dyslexia, dyspraxia, executive dysfunction, and burnout." />
  <meta name="theme-color" content="#3F8F73" />

  <!-- Preload critical assets -->
  <link rel="preload" href="src/assets/bowline-mark.svg" as="image" type="image/svg+xml" />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" as="style" />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" as="style" />

  <link rel="icon" type="image/svg+xml" href="src/assets/bowline-mark.svg" />
  <link rel="apple-touch-icon" href="src/assets/bowline-mark.svg" />

  <!-- DNS prefetch for external CDNs -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>

  <!-- ─── SVG sprite (define the bowline mark once, use everywhere) ─── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="bowline-mark" viewBox="0 0 64 64">
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="28" cy="40" r="18" />
          <ellipse cx="34" cy="22" rx="9" ry="11" />
          <path d="M 38 8 L 38 18" />
          <path d="M 38 30 Q 36 35 28 36" />
        </g>
      </symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <div class="topbar">
      <div id="topbar-content"></div>
    </div>
    <div class="content" id="content"></div>
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <button onclick="go('today')"     id="nb-today"     aria-label="Today view">    <i class="ti ti-sun"            aria-hidden="true"></i>Today</button>
      <button onclick="go('now')"       id="nb-now"       aria-label="Now - current step">      <i class="ti ti-player-play"    aria-hidden="true"></i>Now</button>
      <button onclick="go('plan')"      id="nb-plan"      aria-label="Plan - manage tasks">     <i class="ti ti-checklist"      aria-hidden="true"></i>Plan</button>
      <button onclick="go('tldr')"      id="nb-tldr"      aria-label="TL;DR - understand a message">     <i class="ti ti-message-2"      aria-hidden="true"></i>TL;DR</button>
      <button onclick="go('reset')"     id="nb-reset"     aria-label="Reset - guided resets">    <i class="ti ti-refresh"        aria-hidden="true"></i>Reset</button>
      <button onclick="go('diagnosis')" id="nb-diagnosis" aria-label="Journey - your diagnosis path"><i class="ti ti-map"            aria-hidden="true"></i>Journey</button>
      <button onclick="go('me')"        id="nb-me"        aria-label="Me - profile and settings">       <i class="ti ti-user"           aria-hidden="true"></i>Me</button>
    </nav>
  </div>

  <script type="module">
    import { go } from './src/app/router.js';

    window.go = go;

    // Splash screen is critical path - load immediately
    Promise.all([
      import('./src/features/splash/splash.js'),
    ]).then(() => {
      go('splash');

      // Load remaining features in background (non-blocking)
      const features = [
        './src/features/today/today.js',
        './src/features/now/now.js',
        './src/features/plan/plan.js',
        './src/features/tldr/tldr.js',
        './src/features/reset/reset.js',
        './src/features/diagnosis/diagnosis.js',
        './src/features/me/me.js',
      ];

      features.forEach(module => {
        import(module).catch(err => {
          console.warn(`Failed to load module ${module}:`, err);
        });
      });
    }).catch(err => {
      console.error('Failed to load splash screen:', err);
    });
  </script>
</body>
</html>
